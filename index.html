<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidriera VentaniYA - Sincronización Automática</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0f1d;
      --panel-bg: #161b33;
      --neon-cyan: #00f3ff;
      --neon-orange: #ff9900;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Roboto', sans-serif;
    }

    h1 {
      margin: 0 0 5px 0;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
    }

    p.sub {
      text-align: center;
      color: #a0aec0;
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    .vitrina-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .avisos-card {
      background: var(--panel-bg);
      border-radius: 10px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .avisos-card canvas {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #000;
    }

    .status-msg {
      text-align: center;
      color: var(--neon-cyan);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .empty-msg {
      text-align: center;
      color: #a0aec0;
      grid-column: 1 / -1;
      font-size: 1.1rem;
      padding: 40px;
    }
  </style>
</head>
<body>

  <h1>🏢 Vidriera VentaniYA — Sincronización Automática</h1>
  <p class="sub">Cada foto que agregues a tu repositorio se transforma sola en un aviso fijo global.</p>

  <div id="status" class="status-msg">Escaneando repositorio en busca de avisos...</div>

  <div class="vitrina-grid" id="vitrinaContainer">
    <!-- Los avisos se auto-generan acá -->
  </div>

  <script>
    // TUS DATOS DE GITHUB (Públicos, sin claves ni tokens)
    const GITHUB_USER = 'ofispaciospaseo-del';
    const GITHUB_REPO = 'estanteriavidriera';

    async function escanearYReescribirVidriera() {
      const container = document.getElementById('vitrinaContainer');
      const status = document.getElementById('status');
      container.innerHTML = '';

      try {
        // Consultamos la API pública de GitHub para listar los archivos de la raíz del repositorio
        const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`;
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error('No se pudo conectar con el repositorio.');
        }

        const archivos = await response.json();
        
        // Filtramos solo los archivos que sean imágenes (jpg, jpeg, png)
        const fotos = archivos.filter(file => {
          const name = file.name.toLowerCase();
          return file.type === 'file' && (name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png'));
        });

        if (fotos.length === 0) {
          container.innerHTML = '<div class="empty-msg">📭 No hay fotos en la raíz del repositorio todavía.<br>Subí tus imágenes directo a GitHub y aparecerán aquí automáticamente.</div>';
          status.textContent = '⚠️ Sin avisos detectados.';
          return;
        }

        status.textContent = `✅ ¡Encontradas ${fotos.length} fotos! Procesando carteles fijos...`;

        // Recorremos cada foto encontrada y le aplicamos el formato fijo
        for (const foto of fotos) {
          const card = document.createElement('div');
          card.className = 'avisos-card';

          const canvas = document.createElement('canvas');
          canvas.width = 1000;
          canvas.height = 750;
          const tCtx = canvas.getContext('2d');

          const img = new Image();
          img.crossOrigin = 'anonymous';

          await new Promise((resolve) => {
            img.onload = function() {
              // 1. Dibujar imagen de fondo
              tCtx.drawImage(img, 0, 0, canvas.width, canvas.height);

              // 2. Franja / degradado inferior
              const grad = tCtx.createLinearGradient(0, canvas.height - 180, 0, canvas.height);
              grad.addColorStop(0, 'rgba(0,0,0,0)');
              grad.addColorStop(1, 'rgba(0,0,0,0.85)');
              tCtx.fillStyle = grad;
              tCtx.fillRect(0, canvas.height - 180, canvas.width, 180);

              // 3. Línea de tiempo / Hora y Fecha
              const now = new Date();
              const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
              const dateStr = now.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();

              tCtx.font = '900 38px "Orbitron", monospace';
              tCtx.fillStyle = '#00f3ff';
              tCtx.shadowColor = '#00f3ff';
              tCtx.shadowBlur = 10;
              tCtx.fillText(timeStr, 30, canvas.height - 95);

              tCtx.font = '700 15px "Roboto", sans-serif';
              tCtx.fillStyle = '#fff';
              tCtx.fillText(dateStr, 30, canvas.height - 65);

              // 4. Sello de marca VentaniYA
              tCtx.save();
              const stampX = canvas.width - 120;
              const stampY = canvas.height - 95;
              tCtx.strokeStyle = '#00f3ff';
              tCtx.shadowBlur = 8;
              tCtx.lineWidth = 3;
              tCtx.beginPath();
              tCtx.arc(stampX, stampY, 55, 0, Math.PI * 2);
              tCtx.stroke();

              tCtx.font = '900 10px "Orbitron", sans-serif';
              tCtx.fillStyle = '#00f3ff';
              tCtx.textAlign = 'center';
              tCtx.fillText("VentaniYA", stampX, stampY - 10);
              tCtx.font = '700 8px "Roboto", sans-serif';
              tCtx.fillText("SOLUCIONES", stampX, stampY + 5);
              tCtx.font = '900 14px "Orbitron", sans-serif';
              tCtx.fillText("1001", stampX, stampY + 22);
              tCtx.restore();

              // 5. Cuadro comercial superior fijo
              tCtx.fillStyle = 'rgba(12, 15, 29, 0.85)';
              tCtx.strokeStyle = '#00f3ff';
              tCtx.lineWidth = 1;
              tCtx.fillRect(25, 20, canvas.width - 50, 80);
              tCtx.strokeRect(25, 20, canvas.width - 50, 80);

              tCtx.textAlign = 'left';
              tCtx.font = '700 15px "Roboto", sans-serif';
              tCtx.fillStyle = '#ffffff';
              tCtx.shadowBlur = 0;
              tCtx.fillText(`📍 Dir: Paseo del Este - Local 12`, 45, 45);
              tCtx.fillText(`📞 Tel: +54 9 223 555-1234`, 45, 70);

              resolve();
            };
            img.onerror = function() {
              resolve();
            };
            img.src = foto.download_url + `?t=${Date.now()}`;
          });

          card.appendChild(canvas);
          container.appendChild(card);
        }

        status.textContent = `✅ Vidriera sincronizada: ${fotos.length} avisos fijos activos y visibles en todos lados.`;

      } catch (err) {
        status.textContent = '⚠️ Error al escanear el repositorio. Asegurate de que sea público.';
        container.innerHTML = '<div class="empty-msg">No se pudo cargar la lista de fotos automáticamente.<br>Verificá la conexión.</div>';
      }
    }

    escanearYReescribirVidriera();
  </script>
</body>
</html>
