<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Avisos Fijos - VentaniYA</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0f1d;
      --panel-bg: #161b33;
      --neon-cyan: #00f3ff;
      --neon-orange: #ff9900;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 0 0 5px 0;
      color: var(--neon-cyan);
      text-shadow: 0 0 15px var(--neon-cyan);
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.6rem;
    }

    p.sub {
      text-align: center;
      color: #a0aec0;
      font-size: 0.95rem;
      margin-bottom: 25px;
    }

    .card {
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      border: 2px solid rgba(0, 243, 255, 0.4);
      width: 100%;
      max-width: 500px;
      box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--neon-cyan);
      font-weight: bold;
      font-family: 'Orbitron', sans-serif;
    }

    input[type="file"], input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #2d3748;
      background: #0f1322;
      color: #fff;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Orbitron', sans-serif;
      background: var(--neon-orange);
      color: #000;
      box-shadow: 0 0 15px var(--neon-orange);
      transition: 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .preview-container {
      margin-top: 25px;
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    canvas {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid var(--neon-cyan);
      background: #000;
      display: none;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    }

    .btn-download {
      display: none;
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 15px var(--neon-cyan);
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>🏢 Generador VentaniYA</h1>
  <p class="sub">Subí tu foto y creá al instante tu aviso fijo con línea de tiempo y sello oficial.</p>

  <div class="card">
    <div class="form-group">
      <label>🖼️ Seleccionar Foto:</label>
      <input type="file" id="fotoInput" accept="image/*">
    </div>

    <div class="form-group">
      <label>📍 Dirección Comercial:</label>
      <input type="text" id="dirInput" value="Paseo del Este - Local 12">
    </div>

    <div class="form-group">
      <label>📞 Teléfono / WhatsApp:</label>
      <input type="text" id="telInput" value="+54 9 223 555-1234">
    </div>

    <button class="btn" onclick="procesarAviso()">⚡ GENERAR AVISO FIJO</button>
  </div>

  <div class="preview-container">
    <canvas id="canvasAviso" width="1200" height="900"></canvas>
    <a id="downloadLink" style="text-decoration: none;">
      <button id="btnDescargar" class="btn btn-download">📥 DESCARGAR AVISO LISTO</button>
    </a>
  </div>

  <script>
    function procesarAviso() {
      const fileInput = document.getElementById('fotoInput');
      const dir = document.getElementById('dirInput').value;
      const tel = document.getElementById('telInput').value;

      if (fileInput.files.length === 0) {
        alert('¡Por favor elegí una foto primero!');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('canvasAviso');
          const tCtx = canvas.getContext('2d');

          // 1. Dibujar imagen de fondo adaptada
          tCtx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // 2. Franja inferior oscura para lectura perfecta
          const grad = tCtx.createLinearGradient(0, canvas.height - 240, 0, canvas.height);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          grad.addColorStop(1, 'rgba(0,0,0,0.92)');
          tCtx.fillStyle = grad;
          tCtx.fillRect(0, canvas.height - 240, canvas.width, 240);

          // 3. Hora exacta con milisegundos y fecha completa
          const now = new Date();
          const fechaCompleta = now.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
          const horas = String(now.getHours()).padStart(2, '0');
          const minutos = String(now.getMinutes()).padStart(2, '0');
          const segundos = String(now.getSeconds()).padStart(2, '0');
          const milisegundos = String(now.getMilliseconds()).padStart(3, '0');
          const tiempoPreciso = `${horas}:${minutos}:${segundos}.${milisegundos}`;

          // Hash de seguridad único
          let hashGenerado = "HASH#" + Math.abs(hashCode(file.name + now.getTime())).toString(16).toUpperCase().padStart(8, '0');

          // --- LETRAS GRANDES Y CLARAS ABAJO ---
          tCtx.font = '900 46px "Orbitron", monospace';
          tCtx.fillStyle = '#00f3ff';
          tCtx.shadowColor = '#00f3ff';
          tCtx.shadowBlur = 15;
          tCtx.fillText(tiempoPreciso, 40, canvas.height - 130);

          tCtx.font = '700 22px "Roboto", sans-serif';
          tCtx.fillStyle = '#ffffff';
          tCtx.shadowBlur = 5;
          tCtx.fillText(`📅 ${fechaCompleta}   |   🔐 ${hashGenerado}`, 40, canvas.height - 80);

          // 4. Sello circular VentaniYA grande a la derecha
          tCtx.save();
          const stampX = canvas.width - 150;
          const stampY = canvas.height - 120;
          tCtx.strokeStyle = '#00f3ff';
          tCtx.shadowBlur = 12;
          tCtx.lineWidth = 4;
          tCtx.beginPath();
          tCtx.arc(stampX, stampY, 70, 0, Math.PI * 2);
          tCtx.stroke();

          tCtx.font = '900 13px "Orbitron", sans-serif';
          tCtx.fillStyle = '#00f3ff';
          tCtx.textAlign = 'center';
          tCtx.fillText("VentaniYA", stampX, stampY - 18);
          tCtx.font = '700 11px "Roboto", sans-serif';
          tCtx.fillText("OFICIAL", stampX, stampY + 2);
          tCtx.font = '900 18px "Orbitron", sans-serif';
          tCtx.fillText("1001", stampX, stampY + 26);
          tCtx.restore();

          // 5. Cuadro comercial superior
          tCtx.fillStyle = 'rgba(12, 15, 29, 0.90)';
          tCtx.strokeStyle = '#00f3ff';
          tCtx.lineWidth = 2;
          tCtx.fillRect(35, 30, canvas.width - 70, 100);
          tCtx.strokeRect(35, 30, canvas.width - 70, 100);

          tCtx.textAlign = 'left';
          tCtx.font = '900 24px "Roboto", sans-serif';
          tCtx.fillStyle = '#ffffff';
          tCtx.shadowBlur = 0;
          tCtx.fillText(`📍 Dir: ${dir}`, 60, 70);
          tCtx.fillText(`📞 Tel: ${tel}`, 60, 108);

          // Mostrar canvas y botón de descarga
          canvas.style.display = 'block';
          const btnDescargar = document.getElementById('btnDescargar');
          btnDescargar.style.display = 'block';

          // Preparar enlace de descarga directa
          const imageURL = canvas.toDataURL('image/jpeg', 0.9);
          const downloadLink = document.getElementById('downloadLink');
          downloadLink.href = imageURL;
          downloadLink.download = `aviso_ventaniya_${Date.now()}.jpg`;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function hashCode(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return hash;
    }
  </script>
</body>
</html>
