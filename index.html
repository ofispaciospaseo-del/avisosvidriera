<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidriera VentaniYA - Sincronizada en la Nube</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0c0f1d;
      --panel-bg: #161b33;
      --neon-cyan: #00f3ff;
      --neon-orange: #ff9900;
      --card-bg: #1c2340;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 15px;
      background-color: var(--bg-color);
      color: #fff;
      font-family: 'Roboto', sans-serif;
    }

    h1 {
      margin: 0 0 10px 0;
      color: var(--neon-cyan);
      text-shadow: 0 0 10px var(--neon-cyan);
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--neon-cyan);
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-family: 'Orbitron', sans-serif;
    }

    .tab-btn.active {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .view-section {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
    }

    .view-section.active {
      display: block;
    }

    .admin-container {
      background: var(--panel-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 153, 0, 0.3);
      max-width: 600px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 0.85rem;
      color: #a0aec0;
      font-weight: bold;
    }

    input[type="text"], input[type="file"], input[type="password"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #2d3748;
      background: #0f1322;
      color: #fff;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      font-family: 'Orbitron', sans-serif;
    }

    .btn-save {
      background: var(--neon-orange);
      color: #000;
      box-shadow: 0 0 10px var(--neon-orange);
    }

    .vitrina-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .avisos-card {
      background: var(--panel-bg);
      border-radius: 10px;
      border: 1px solid rgba(0, 243, 255, 0.3);
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    .avisos-card canvas {
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: #000;
      margin-bottom: 10px;
    }

    .status-msg {
      text-align: center;
      color: var(--neon-cyan);
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .empty-msg {
      text-align: center;
      color: #a0aec0;
      grid-column: 1 / -1;
      font-size: 1.1rem;
      padding: 40px;
    }
  </style>
</head>
<body>

  <h1>🏢 Vidriera VentaniYA — Sincronizada en la Nube</h1>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('vitrina')">👁️ Ver Vidriera Pública</button>
    <button class="tab-btn" onclick="switchTab('admin')">➕ Subir Aviso (Nube)</button>
  </div>

  <div id="vitrinaView" class="view-section active">
    <div id="statusVitrina" class="status-msg">Cargando avisos globales desde GitHub...</div>
    <div class="vitrina-grid" id="vitrinaContainer"></div>
  </div>

  <div id="adminView" class="view-section">
    <div class="admin-container">
      <h3 style="color: var(--neon-orange); margin-top:0;">📤 Subir Aviso Global (Visible en todos lados)</h3>
      
      <div class="form-group">
        <label>🔑 GitHub Token (Personal Access Token de tu cuenta):</label>
        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        <small style="color: #a0aec0; font-size: 0.75rem;">Se guarda solo en tu navegador para autorizar la subida.</small>
      </div>

      <div class="form-group">
        <label>🖼️ Seleccionar Foto de Producto / Estante:</label>
        <input type="file" id="subImage" accept="image/*">
      </div>

      <div class="form-group">
        <label>📍 Dirección Comercial:</label>
        <input type="text" id="subDir" value="Paseo del Este - Local 12">
      </div>

      <div class="form-group">
        <label>📞 Teléfono / WhatsApp:</label>
        <input type="text" id="subTel" value="+54 9 223 555-1234">
      </div>

      <button class="btn btn-save" onclick="publicarEnNube()">🚀 PUBLICAR Y GUARDAR EN LA NUBE</button>
    </div>
  </div>

  <script>
    const GITHUB_USER = 'ofispaciospaseo-del';
    const GITHUB_REPO = 'estanteriavidriera';
    const DATA_FILE_PATH = 'avisos.json';

    // Recordar el token en este dispositivo si ya lo ingresó
    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('ventaniya_gh_token');
      if (savedToken) {
        document.getElementById('githubToken').value = savedToken;
      }
      cargarAvisosGlobales();
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));

      if (tab === 'vitrina') {
        document.querySelector('.nav-tabs button:nth-child(1)').classList.add('active');
        document.getElementById('vitrinaView').classList.add('active');
        cargarAvisosGlobales();
      } else {
        document.querySelector('.nav-tabs button:nth-child(2)').classList.add('active');
        document.getElementById('adminView').classList.add('active');
      }
    }

    // Cargar la lista global de avisos desde el archivo JSON del repositorio
    async function cargarAvisosGlobales() {
      const status = document.getElementById('statusVitrina');
      status.textContent = 'Actualizando vitrina desde la nube...';
      
      try {
        const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${DATA_FILE_PATH}?t=${Date.now()}`;
        const res = await fetch(url);
        if (res.ok) {
          const avisos = await res.json();
          renderVitrina(avisos);
          status.textContent = `✅ Sincronizado: ${avisos.length} avisos activos en la nube.`;
        } else {
          renderVitrina([]);
          status.textContent = '📭 Todavía no hay avisos en el archivo global.';
        }
      } catch (e) {
        renderVitrina([]);
        status.textContent = '⚠️ Conectando con la nube... (si es la primera vez, subí un aviso para crear el archivo).';
      }
    }

    // Publicar aviso procesando la imagen y haciendo commit automático al repo
    async function publicarEnNube() {
      const token = document.getElementById('githubToken').value.trim();
      const fileInput = document.getElementById('subImage');
      const dir = document.getElementById('subDir').value;
      const tel = document.getElementById('subTel').value;

      if (!token) {
        alert('¡Por favor ingresá tu Token de GitHub para poder guardar en la nube!');
        return;
      }
      if (fileInput.files.length === 0) {
        alert('¡Por favor elegí una foto!');
        return;
      }

      localStorage.setItem('ventaniya_gh_token', token);

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(e) {
        const imgDataUrl = e.target.result;
        
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 1000;
        tempCanvas.height = 750;
        const tCtx = tempCanvas.getContext('2d');

        const img = new Image();
        img.onload = async function() {
          // 1. Dibujar imagen de fondo
          tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);

          // 2. Degradado inferior
          const grad = tCtx.createLinearGradient(0, tempCanvas.height - 180, 0, tempCanvas.height);
          grad.addColorStop(0, 'rgba(0,0,0,0)');
          grad.addColorStop(1, 'rgba(0,0,0,0.85)');
          tCtx.fillStyle = grad;
          tCtx.fillRect(0, tempCanvas.height - 180, tempCanvas.width, 180);

          // 3. Fecha y hora
          const now = new Date();
          const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
          const dateStr = now.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase();

          tCtx.font = '900 38px "Orbitron", monospace';
          tCtx.fillStyle = '#00f3ff';
          tCtx.shadowColor = '#00f3ff';
          tCtx.shadowBlur = 10;
          tCtx.fillText(timeStr, 30, tempCanvas.height - 95);

          tCtx.font = '700 15px "Roboto", sans-serif';
          tCtx.fillStyle = '#fff';
          tCtx.fillText(dateStr, 30, tempCanvas.height - 65);

          // 4. Estampa VentaniYA
          tCtx.save();
          const stampX = tempCanvas.width - 120;
          const stampY = tempCanvas.height - 95;
          tCtx.strokeStyle = '#00f3ff';
          tCtx.shadowBlur = 8;
          tCtx.lineWidth = 3;
          tCtx.beginPath();
          tCtx.arc(stampX, stampY, 55, 0, Math.PI * 2);
          tCtx.stroke();

          tCtx.font = '900 10px "Orbitron", sans-serif';
          tCtx.fillStyle = '#00f3ff';
          tCtx.textAlign = 'center';
          tCtx.fillText("VentaniYA", stampX, stampY - 10);
          tCtx.font = '700 8px "Roboto", sans-serif';
          tCtx.fillText("SOLUCIONES", stampX, stampY + 5);
          tCtx.font = '900 14px "Orbitron", sans-serif';
          tCtx.fillText("1001", stampX, stampY + 22);
          tCtx.restore();

          // 5. Cuadro comercial superior
          tCtx.fillStyle = 'rgba(12, 15, 29, 0.85)';
          tCtx.strokeStyle = '#00f3ff';
          tCtx.lineWidth = 1;
          tCtx.fillRect(25, 20, tempCanvas.width - 50, 80);
          tCtx.strokeRect(25, 20, tempCanvas.width - 50, 80);

          tCtx.textAlign = 'left';
          tCtx.font = '700 15px "Roboto", sans-serif';
          tCtx.fillStyle = '#ffffff';
          tCtx.shadowBlur = 0;
          tCtx.fillText(`📍 Dir: ${dir}`, 45, 45);
          tCtx.fillText(`📞 Tel: ${tel}`, 45, 70);

          const finalImageCode = tempCanvas.toDataURL('image/jpeg', 0.85);

          alert('📤 Subiendo aviso y sincronizando con la nube de GitHub...');

          try {
            // Obtener el archivo JSON actual de GitHub para actualizarlo
            const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`;
            let sha = null;
            let avisosActuales = [];

            const getRes = await fetch(apiUrl, {
              headers: { 'Authorization': `token ${token}` }
            });

            if (getRes.ok) {
              const fileData = await getRes.json();
              sha = fileData.sha;
              const decoded = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
              avisosActuales = decoded;
            }

            // Agregar nuevo aviso al principio de la lista global
            avisosActuales.unshift({
              id: Date.now(),
              imagen: finalImageCode,
              dir: dir,
              tel: tel
            });

            if (avisosActuales.length > 100) avisosActuales.pop();

            // Enviar archivo actualizado al repositorio de GitHub mediante API
            const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(avisosActuales))));

            const putRes = await fetch(apiUrl, {
              method: 'PUT',
              headers: {
                'Authorization': `token ${token}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: 'Actualización automática de avisos globales VentaniYA',
                content: contentEncoded,
                sha: sha
              })
            });

            if (putRes.ok) {
              alert('✅ ¡Aviso guardado en la nube con éxito! Ya se ve en todos lados.');
              fileInput.value = '';
              switchTab('vitrina');
            } else {
              const errJson = await putRes.json();
              alert('❌ Error al guardar en GitHub: ' + (errJson.message || 'Token inválido o sin permisos.'));
            }

          } catch (err) {
            alert('❌ Error de conexión al sincronizar: ' + err.message);
          }
        };
        img.src = imgDataUrl;
      };
      reader.readAsDataURL(file);
    }

    // Dibujar los avisos en la pantalla pública
    function renderVitrina(avisos) {
      const container = document.getElementById('vitrinaContainer');
      container.innerHTML = '';

      if (!avisos || avisos.length === 0) {
        container.innerHTML = '<div class="empty-msg">📭 No hay avisos en la nube todavía.<br>Entrá a <b>"Subir Aviso (Nube)"</b> para cargar el primero.</div>';
        return;
      }

      avisos.forEach((aviso) => {
        const card = document.createElement('div');
        card.className = 'avisos-card';

        const canvas = document.createElement('canvas');
        canvas.width = 1000;
        canvas.height = 750;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        img.onload = function() {
          ctx.drawImage(img, 0, 0);
        };
        img.src = aviso.imagen;

        card.appendChild(canvas);
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
